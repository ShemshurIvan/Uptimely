spring.application.name=Uptimely1
spring.main.banner-mode=off
logging.level.root=warn
logging.level.com.project.uptimely=info
logging.level.org.springframework.boot=info
spring.datasource.url=jdbc:h2:mem:uptimely
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.data.web.pageable.max-page-size=100
spring.threads.virtual.enabled=true

# Health checks
uptimely.check.connect-timeout=5s
uptimely.check.response-timeout=10s

# Scheduler: how often to look for due monitors, and how many to check in parallel
uptimely.scheduler.tick=5s
uptimely.scheduler.concurrency=10

# Alerts: status changes are always logged; set a Slack-compatible incoming webhook URL to also post them
uptimely.alert.webhook-url=